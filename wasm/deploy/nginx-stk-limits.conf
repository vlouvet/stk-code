# /etc/nginx/conf.d/stk-limits.conf
# Shared rate-limit + connection-limit zones for stk.linuxcolorado.com.
# Must live in http {} context, hence /etc/nginx/conf.d/.

# 60 req/s per IP burst 30 — comfortable for asset-pack chunk loads.
limit_req_zone $binary_remote_addr zone=stk_req:10m rate=60r/s;

# 16 simultaneous connections per IP — covers WS + parallel asset pulls.
limit_conn_zone $binary_remote_addr zone=stk_conn:10m;
