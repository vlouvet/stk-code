# /etc/fail2ban/filter.d/stk-nginx-noscript.conf
# Matches scanner traffic that nginx silently 444-drops.
# The 444 close-without-response shows up as status 000 in some setups,
# but with nginx's default log_format combined it shows as 444.
[Definition]
failregex = ^<HOST> .* "(?:GET|POST|HEAD) /.*(?:\.env|\.git|\.svn|\.htaccess|\.htpasswd|wp-(?:admin|login|content|includes)|phpmyadmin|xmlrpc\.php|/vendor/|/cgi-bin/|/actuator/|Jenkinsfile|Dockerfile|cloudbuild\.ya?ml|app\.ya?ml|web\.config|\.bak|\.old|\.swp|\.sql).*" (?:444|400|403|404)
ignoreregex =
