# /etc/nginx/sites-available/stk.linuxcolorado.com
# Hardened public-facing config. Rate-limit zones come from
# /etc/nginx/conf.d/stk-limits.conf.

# HTTP -> HTTPS redirect (certbot maintains this).
server {
    if ($host = stk.linuxcolorado.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name stk.linuxcolorado.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stk.linuxcolorado.com;

    ssl_certificate /etc/letsencrypt/live/stk.linuxcolorado.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stk.linuxcolorado.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/stk.access.log;
    root /home/vlouvet/stk-wasm/web;
    index index.html;

    # --- Rate / connection limits (zones declared in conf.d/stk-limits.conf) ---
    limit_req zone=stk_req burst=30 nodelay;
    limit_conn stk_conn 16;
    limit_req_status 429;
    limit_conn_status 429;

    # Drop overlarge requests cheaply.
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Required for wasm SharedArrayBuffer (pthread workers).
    add_header Cross-Origin-Opener-Policy   "same-origin"   always;
    add_header Cross-Origin-Embedder-Policy "require-corp"  always;
    add_header Cross-Origin-Resource-Policy "same-origin"   always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # --- Cheap denial of common scanner paths (cut the wire silently with 444) ---
    # These patterns never appear in real STK traffic; matching them is also a
    # strong signal for fail2ban's nginx-noscript jail (see /etc/fail2ban/).
    location ~* (?:\.env|\.git|\.svn|\.htaccess|\.htpasswd|/wp-(?:admin|login|content|includes)|/phpmyadmin|/xmlrpc\.php|/vendor/|/cgi-bin/|/actuator/|/Jenkinsfile|/Dockerfile|/cloudbuild\.ya?ml|/app\.ya?ml|/web\.config|\.bak$|\.old$|\.swp$|\.sql$)  {
        return 444;
    }

    # index.html stays fresh.
    location = /index.html {
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
        add_header Cross-Origin-Resource-Policy "same-origin"   always;
        add_header Cache-Control "no-cache, max-age=0";
    }
    location ~ \.(wasm|js|tar\.gz)$ {
        add_header Cross-Origin-Opener-Policy   "same-origin"   always;
        add_header Cross-Origin-Embedder-Policy "require-corp"  always;
        add_header Cross-Origin-Resource-Policy "same-origin"   always;
        add_header Cache-Control "public, max-age=86400";
        gzip off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # WebSocket -> wsproxy.
    location /ws/ {
        # WS upgrades don't carry a body; reject any that try.
        client_max_body_size 1k;

        rewrite ^/ws/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}
